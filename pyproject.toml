[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-blacklight-security"
dynamic = ["version"]
description = "Open-source cloud and container security scanning and risk visibility toolkit."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Dennis Oloane" }
]
keywords = ["cybersecurity", "aws", "cloud-security", "container-security", "docker", "security-scanner", "devsecops"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "boto3>=1.34,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]
release = [
  "build>=1.2,<2",
  "twine>=6,<7",
]
standalone = [
  "pyinstaller>=6.15,<7",
]

[project.scripts]
blacklight = "blacklight_security.cli:main"

[project.urls]
Homepage = "https://github.com/OloaneShark/Project_Blacklight"
Repository = "https://github.com/OloaneShark/Project_Blacklight"
Documentation = "https://github.com/OloaneShark/Project_Blacklight/tree/main/docs"
Changelog = "https://github.com/OloaneShark/Project_Blacklight/blob/main/CHANGELOG.md"
Issues = "https://github.com/OloaneShark/Project_Blacklight/issues"

[tool.setuptools.dynamic]
version = { attr = "blacklight_security.__version__" }

[tool.setuptools.packages.find]
include = ["blacklight_security*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
