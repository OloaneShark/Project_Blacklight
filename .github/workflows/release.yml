name: Publish Python package

on:
  release:
    types: [published]
  workflow_run:
    workflows: ["Prepare GitHub Release"]
    types: [completed]

jobs:
  prepare:
    name: validate published release artifacts
    if: >
      github.event_name == 'release' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_publish: ${{ steps.context.outputs.should_publish }}
      release_tag: ${{ steps.context.outputs.release_tag }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve publish context
        id: context
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          PACKAGE_VERSION="$(python -c 'from blacklight_security import __version__; print(__version__)')"
          RELEASE_TAG="$EVENT_RELEASE_TAG"
          SHOULD_PUBLISH=true

          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            RELEASE_TAG="v$PACKAGE_VERSION"

            if [[ ! "$PACKAGE_VERSION" =~ (a|b|rc)[0-9]+$ ]]; then
              echo "Stable release publication waits for the human release event."
              SHOULD_PUBLISH=false
            elif ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              echo "Automated prerelease $RELEASE_TAG was not found."
              SHOULD_PUBLISH=false
            else
              RELEASE_META="$(gh release view "$RELEASE_TAG" --json isDraft,targetCommitish)"
              IS_DRAFT="$(printf '%s' "$RELEASE_META" | jq -r '.isDraft')"
              RELEASE_TARGET="$(printf '%s' "$RELEASE_META" | jq -r '.targetCommitish')"
              if [ "$IS_DRAFT" = "true" ]; then
                echo "Release $RELEASE_TAG is still a draft."
                SHOULD_PUBLISH=false
              elif [ "$RELEASE_TARGET" != "$WORKFLOW_HEAD_SHA" ]; then
                echo "Release $RELEASE_TAG targets $RELEASE_TARGET, not this workflow commit $WORKFLOW_HEAD_SHA."
                SHOULD_PUBLISH=false
              fi
            fi
          fi

          RELEASE_VERSION="${RELEASE_TAG#v}"
          if [ "$SHOULD_PUBLISH" = "true" ] && [ "$RELEASE_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $PACKAGE_VERSION."
            exit 1
          fi

          {
            echo "should_publish=$SHOULD_PUBLISH"
            echo "release_tag=$RELEASE_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Download GitHub Release Python distributions
        if: steps.context.outputs.should_publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.context.outputs.release_tag }}
        run: |
          mkdir -p dist
          gh release download "$RELEASE_TAG"             --pattern "project_blacklight_security-*.whl"             --pattern "project_blacklight_security-*.tar.gz"             --dir dist

      - name: Verify expected versioned artifacts are present
        if: steps.context.outputs.should_publish == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.context.outputs.release_tag }}
        run: |
          RELEASE_VERSION="${RELEASE_TAG#v}"
          WHEEL_COUNT="$(find dist -maxdepth 1 -type f -name "project_blacklight_security-${RELEASE_VERSION}-*.whl" | wc -l)"
          SDIST_COUNT="$(find dist -maxdepth 1 -type f -name "project_blacklight_security-${RELEASE_VERSION}.tar.gz" | wc -l)"

          if [ "$WHEEL_COUNT" -ne 1 ] || [ "$SDIST_COUNT" -ne 1 ]; then
            echo "Expected exactly one wheel and one source distribution for version $RELEASE_VERSION."
            find dist -maxdepth 1 -type f -print
            exit 1
          fi

      - name: Install release validation tooling
        if: steps.context.outputs.should_publish == 'true'
        run: python -m pip install "twine>=6,<7"

      - name: Validate release distributions
        if: steps.context.outputs.should_publish == 'true'
        run: python -m twine check dist/*

      - name: Upload validated distributions for publish job
        if: steps.context.outputs.should_publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: publish distributions to PyPI
    needs: prepare
    if: needs.prepare.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/project-blacklight-security
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Download validated release distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
