name: Publish Python package

on:
  release:
    types: [published]

jobs:
  prepare:
    name: validate published release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out released source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify release tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(python -c 'from blacklight_security import __version__; print(__version__)')"
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$RELEASE_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version $PACKAGE_VERSION."
            exit 1
          fi

      - name: Download GitHub Release distributions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "$GITHUB_REF_NAME"             --pattern "*.whl"             --pattern "*.tar.gz"             --dir dist

      - name: Verify expected versioned artifacts are present
        shell: bash
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          WHEEL_COUNT="$(find dist -maxdepth 1 -type f -name "project_blacklight_security-${RELEASE_VERSION}-*.whl" | wc -l)"
          SDIST_COUNT="$(find dist -maxdepth 1 -type f -name "project_blacklight_security-${RELEASE_VERSION}.tar.gz" | wc -l)"

          if [ "$WHEEL_COUNT" -ne 1 ] || [ "$SDIST_COUNT" -ne 1 ]; then
            echo "Expected exactly one wheel and one source distribution for version $RELEASE_VERSION."
            find dist -maxdepth 1 -type f -print
            exit 1
          fi

      - name: Install release validation tooling
        run: python -m pip install "twine>=6,<7"

      - name: Validate release distributions
        run: python -m twine check dist/*

      - name: Upload validated distributions for publish job
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: publish distributions to PyPI
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/project-blacklight-security
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Download validated release distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
