name: Publish Python package

on:
  release:
    types: [published]

jobs:
  build:
    name: build release distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify release tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(python -c 'from blacklight_security import __version__; print(__version__)')"
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$RELEASE_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version $PACKAGE_VERSION."
            exit 1
          fi

      - name: Install release tooling
        run: python -m pip install ".[release]"

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distribution metadata and README
        run: python -m twine check dist/*

      - name: Upload release distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/project-blacklight-security
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
