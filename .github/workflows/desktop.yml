name: Blacklight Desktop CI

on:
  pull_request:
    paths:
      - "blacklight_security/desktop/**"
      - "blacklight_security/scanners/**"
      - "blacklight_security/runner.py"
      - "blacklight_security/risk.py"
      - "blacklight_security/coverage.py"
      - "pyproject.toml"
      - "tools/build_desktop.py"
      - "tools/desktop_entry.py"
      - ".github/workflows/desktop.yml"
      - ".github/workflows/github-release.yml"
  push:
    branches: [main]
    paths:
      - "blacklight_security/desktop/**"
      - "blacklight_security/scanners/**"
      - "blacklight_security/runner.py"
      - "blacklight_security/risk.py"
      - "blacklight_security/coverage.py"
      - "pyproject.toml"
      - "tools/build_desktop.py"
      - "tools/desktop_entry.py"
      - ".github/workflows/desktop.yml"
      - ".github/workflows/github-release.yml"
  workflow_dispatch:

jobs:
  build:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - windows-11-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Blacklight Desktop dependencies
        run: python -m pip install -e ".[desktop]"

      - name: Smoke-test desktop UI from source
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m blacklight_security.desktop.app --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Capture desktop screenshots
        if: matrix.os == 'windows-latest'
        run: python tools/capture_desktop_screenshots.py

      - name: Upload desktop screenshots
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: blacklight-desktop-screenshots
          path: desktop-screenshots/*.png
          if-no-files-found: error

      - name: Build and smoke-test desktop executable
        run: python tools/build_desktop.py

      - name: Upload desktop executable
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}-${{ runner.arch }}
          path: desktop-dist/*
          if-no-files-found: error
