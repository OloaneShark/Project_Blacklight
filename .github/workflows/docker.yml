name: Docker CI

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "blacklight_security/**"
      - "pyproject.toml"
      - "README.md"
      - ".github/workflows/docker.yml"
      - ".github/workflows/docker-release.yml"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "blacklight_security/**"
      - "pyproject.toml"
      - "README.md"
      - ".github/workflows/docker.yml"
      - ".github/workflows/docker-release.yml"
  workflow_dispatch:

jobs:
  container:
    name: container build and smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          VERSION="$(python -c 'from blacklight_security import __version__; print(__version__)')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Blacklight container
        shell: bash
        run: |
          docker build \
            --build-arg VERSION="${{ steps.version.outputs.version }}" \
            --build-arg REVISION="${{ github.sha }}" \
            --tag project-blacklight:ci \
            .

      - name: Smoke-test Blacklight version
        shell: bash
        run: |
          ACTUAL="$(docker run --rm project-blacklight:ci --version)"
          EXPECTED="Project Blacklight ${{ steps.version.outputs.version }}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Container returned '$ACTUAL'; expected '$EXPECTED'."
            exit 1
          fi

      - name: Verify non-root runtime
        shell: bash
        run: |
          USER_ID="$(docker run --rm --entrypoint python project-blacklight:ci -c 'import os; print(os.geteuid())')"
          if [ "$USER_ID" = "0" ]; then
            echo "Container runtime is root."
            exit 1
          fi

      - name: Smoke-test CLI parser
        run: docker run --rm project-blacklight:ci scan aws --help

      - name: Verify OCI version label
        shell: bash
        run: |
          LABEL_VERSION="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' project-blacklight:ci)"
          if [ "$LABEL_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "OCI label version '$LABEL_VERSION' did not match package version."
            exit 1
          fi
