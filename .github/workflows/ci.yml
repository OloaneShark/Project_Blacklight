name: Blacklight CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check blacklight_security tests scripts

      - name: Run tests
        run: pytest -q

      - name: Run credential-free demo smoke test
        run: python scripts/verify_demo.py

  source-install-smoke:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Blacklight from source
        run: python -m pip install .

      - name: Verify installed CLI and local demo
        run: python scripts/verify_demo.py
