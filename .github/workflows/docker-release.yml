name: Publish Docker image

on:
  release:
    types: [published]
  workflow_run:
    workflows: ["Prepare GitHub Release"]
    types: [completed]

jobs:
  publish:
    name: publish multi-platform image to GHCR
    if: >
      github.event_name == 'release' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.workflow_run.head_sha }}

      - name: Resolve and verify image version
        id: image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVENT_IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          PACKAGE_VERSION="$(python -c 'from blacklight_security import __version__; print(__version__)')"
          RELEASE_TAG="$EVENT_RELEASE_TAG"
          IS_PRERELEASE="$EVENT_IS_PRERELEASE"
          SHOULD_PUBLISH=true

          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            RELEASE_TAG="v$PACKAGE_VERSION"

            if [[ ! "$PACKAGE_VERSION" =~ (a|b|rc)[0-9]+$ ]]; then
              echo "Stable container publication waits for the human release event."
              SHOULD_PUBLISH=false
              IS_PRERELEASE=false
            elif ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              echo "Automated prerelease $RELEASE_TAG was not found."
              SHOULD_PUBLISH=false
              IS_PRERELEASE=true
            else
              IS_DRAFT="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
              if [ "$IS_DRAFT" = "true" ]; then
                echo "Release $RELEASE_TAG is still a draft."
                SHOULD_PUBLISH=false
              fi
              IS_PRERELEASE=true
            fi
          fi

          RELEASE_VERSION="${RELEASE_TAG#v}"
          if [ "$SHOULD_PUBLISH" = "true" ] && [ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $PACKAGE_VERSION."
            exit 1
          fi

          IMAGE="ghcr.io/oloaneshark/project-blacklight"
          REVISION="$(git rev-parse HEAD)"
          {
            echo "should_publish=$SHOULD_PUBLISH"
            echo "version=$RELEASE_VERSION"
            echo "revision=$REVISION"
            echo "image=$IMAGE"
            echo "tags<<EOF"
            if [ "$SHOULD_PUBLISH" = "true" ]; then
              echo "$IMAGE:$RELEASE_VERSION"
              if [ "$IS_PRERELEASE" = "false" ]; then
                echo "$IMAGE:latest"
              fi
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.image.outputs.should_publish == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.image.outputs.should_publish == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.image.outputs.should_publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-platform image
        if: steps.image.outputs.should_publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
            REVISION=${{ steps.image.outputs.revision }}
            SOURCE=https://github.com/OloaneShark/Project_Blacklight
          labels: |
            org.opencontainers.image.title=Project Blacklight
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
            org.opencontainers.image.source=https://github.com/OloaneShark/Project_Blacklight
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
