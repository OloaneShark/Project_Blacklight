name: Prepare GitHub Release

on:
  push:
    tags:
      - "v*"

jobs:
  validate:
    name: validate release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag, version, changelog, and main ancestry
        shell: bash
        run: |
          git fetch origin main

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag $GITHUB_REF_NAME does not point to a commit contained in main."
            exit 1
          fi

          PACKAGE_VERSION="$(python -c 'from blacklight_security import __version__; print(__version__)')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $PACKAGE_VERSION."
            exit 1
          fi

          CHANGELOG_VERSION="$(python - <<'PY'
          import re
          from blacklight_security import __version__

          match = re.fullmatch(r"(\d+\.\d+\.\d+)(a|b|rc)(\d+)", __version__)
          if not match:
              print(__version__)
          else:
              base, stage, number = match.groups()
              label = {"a": "alpha", "b": "beta", "rc": "rc"}[stage]
              print(f"{base}-{label}.{number}")
          PY
          )"

          if ! grep -Fq "## [$CHANGELOG_VERSION]" CHANGELOG.md; then
            echo "CHANGELOG.md does not contain ## [$CHANGELOG_VERSION]."
            exit 1
          fi

  build-python:
    name: build Python distributions
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release tooling
        run: python -m pip install ".[release]"

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate Python distributions
        run: python -m twine check dist/*

      - name: Smoke-test built wheel
        shell: bash
        run: |
          python -m venv /tmp/blacklight-release-wheel
          /tmp/blacklight-release-wheel/bin/python -m pip install dist/*.whl
          /tmp/blacklight-release-wheel/bin/blacklight --version

      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  build-standalone:
    name: standalone (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Blacklight and standalone tooling
        run: python -m pip install -e ".[standalone]"

      - name: Build and smoke-test standalone executable
        run: python tools/build_standalone.py

      - name: Upload standalone archive
        uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ runner.os }}-${{ runner.arch }}
          path: standalone-dist/*
          if-no-files-found: error

  prepare-release:
    name: prepare draft GitHub Release
    needs:
      - build-python
      - build-standalone
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Python distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: release-assets

      - name: Download standalone archives
        uses: actions/download-artifact@v4
        with:
          pattern: standalone-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS

      - name: Create or refresh draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PACKAGE_VERSION="$(python -c 'from blacklight_security import __version__; print(__version__)')"
          TITLE="Project Blacklight v$PACKAGE_VERSION"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')"
            if [ "$IS_DRAFT" != "true" ]; then
              echo "Release $GITHUB_REF_NAME already exists and is published; refusing to overwrite it."
              exit 1
            fi

            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            EXTRA_FLAGS=()
            if [[ "$PACKAGE_VERSION" =~ (a|b|rc)[0-9]+$ ]]; then
              EXTRA_FLAGS+=(--prerelease)
            fi

            gh release create "$GITHUB_REF_NAME"               release-assets/*               --draft               --generate-notes               --title "$TITLE"               "${EXTRA_FLAGS[@]}"
          fi
