name: Prepare GitHub Release

on:
  push:
    branches: [main]
    tags:
      - "v*"

jobs:
  validate:
    name: validate release source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      source_sha: ${{ steps.release.outputs.source_sha }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve and validate release source
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main --tags

          PACKAGE_VERSION="$(python -c 'from blacklight_security import __version__; print(__version__)')"
          TAG_NAME="v$PACKAGE_VERSION"
          SOURCE_SHA="$GITHUB_SHA"

          if [[ "$GITHUB_REF" == refs/tags/* ]] && [ "$GITHUB_REF_NAME" != "$TAG_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $PACKAGE_VERSION."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$SOURCE_SHA" origin/main; then
            echo "Release source $SOURCE_SHA is not contained in main."
            exit 1
          fi

          CHANGELOG_VERSION="$(python - <<'PY'
          import re
          from blacklight_security import __version__

          match = re.fullmatch(r"(\d+\.\d+\.\d+)(a|b|rc)(\d+)", __version__)
          if not match:
              print(__version__)
          else:
              base, stage, number = match.groups()
              label = {"a": "alpha", "b": "beta", "rc": "rc"}[stage]
              print(f"{base}-{label}.{number}")
          PY
          )"

          if ! grep -Fq "## [$CHANGELOG_VERSION]" CHANGELOG.md; then
            echo "CHANGELOG.md does not contain ## [$CHANGELOG_VERSION]."
            exit 1
          fi

          PRERELEASE=false
          if [[ "$PACKAGE_VERSION" =~ (a|b|rc)[0-9]+$ ]]; then
            PRERELEASE=true
          fi

          if [[ "$GITHUB_REF" == refs/heads/main ]] && [ "$PRERELEASE" != "true" ]; then
            echo "Stable versions require an explicit version tag; skipping automatic release."
            SHOULD_RELEASE=false
          elif gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; skipping duplicate preparation."
            SHOULD_RELEASE=false
          else
            SHOULD_RELEASE=true
          fi

          {
            echo "should_release=$SHOULD_RELEASE"
            echo "release_tag=$TAG_NAME"
            echo "prerelease=$PRERELEASE"
            echo "source_sha=$SOURCE_SHA"
          } >> "$GITHUB_OUTPUT"

  build-python:
    name: build Python distributions
    needs: validate
    if: needs.validate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release tooling
        run: python -m pip install ".[release]"

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate Python distributions
        run: python -m twine check dist/*

      - name: Smoke-test built wheel
        shell: bash
        run: |
          python -m venv /tmp/blacklight-release-wheel
          /tmp/blacklight-release-wheel/bin/python -m pip install dist/*.whl
          /tmp/blacklight-release-wheel/bin/blacklight --version

      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  build-standalone:
    name: standalone (${{ matrix.os }})
    needs: validate
    if: needs.validate.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - windows-11-arm
          - macos-latest
          - macos-15-intel

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Blacklight and standalone tooling
        run: python -m pip install -e ".[standalone]"

      - name: Build and smoke-test standalone executable
        run: python tools/build_standalone.py

      - name: Upload standalone archive
        uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ runner.os }}-${{ runner.arch }}
          path: standalone-dist/*
          if-no-files-found: error

  prepare-release:
    name: publish alpha or prepare stable release
    needs:
      - validate
      - build-python
      - build-standalone
    if: needs.validate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Python distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: release-assets

      - name: Download standalone archives
        uses: actions/download-artifact@v4
        with:
          pattern: standalone-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: |
          PACKAGE_VERSION="$(python -c 'from blacklight_security import __version__; print(__version__)')"
          TITLE="Project Blacklight v$PACKAGE_VERSION"

          if [ "$PRERELEASE" = "true" ]; then
            gh release create "$RELEASE_TAG"               release-assets/*               --target "$SOURCE_SHA"               --prerelease               --generate-notes               --title "$TITLE"
          else
            gh release create "$RELEASE_TAG"               release-assets/*               --target "$SOURCE_SHA"               --draft               --generate-notes               --title "$TITLE"
          fi
