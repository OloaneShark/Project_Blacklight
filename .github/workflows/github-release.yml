name: Prepare GitHub Release

on:
  push:
    tags:
      - "v*"

jobs:
  prepare-release:
    name: build and prepare versioned release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(python -c 'from blacklight_security import __version__; print(__version__)')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $PACKAGE_VERSION."
            exit 1
          fi

      - name: Install release tooling
        run: python -m pip install ".[release]"

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate release distributions
        run: python -m twine check dist/*

      - name: Smoke-test built wheel
        shell: bash
        run: |
          python -m venv /tmp/blacklight-release-wheel
          /tmp/blacklight-release-wheel/bin/python -m pip install dist/*.whl
          /tmp/blacklight-release-wheel/bin/blacklight --version

      - name: Create or refresh draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PACKAGE_VERSION="$(python -c 'from blacklight_security import __version__; print(__version__)')"
          TITLE="Project Blacklight v$PACKAGE_VERSION"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')"
            if [ "$IS_DRAFT" != "true" ]; then
              echo "Release $GITHUB_REF_NAME already exists and is published; refusing to overwrite it."
              exit 1
            fi

            gh release upload "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz --clobber
          else
            EXTRA_FLAGS=()
            if [[ "$PACKAGE_VERSION" =~ (a|b|rc)[0-9]+$ ]]; then
              EXTRA_FLAGS+=(--prerelease)
            fi

            gh release create "$GITHUB_REF_NAME"               dist/*.whl               dist/*.tar.gz               --draft               --generate-notes               --title "$TITLE"               "${EXTRA_FLAGS[@]}"
          fi
