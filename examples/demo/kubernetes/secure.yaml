apiVersion: apps/v1
kind: Deployment
metadata:
  name: blacklight-secure-demo
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blacklight-secure-demo
  template:
    metadata:
      labels:
        app: blacklight-secure-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: nginx@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
